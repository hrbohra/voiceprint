[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceprint"
version = "0.1.0"
description = "Extract the measurable voice of a speaker from a text corpus, verify it as rules, and tune an LLM to it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harsh Bohra" }]
dependencies = [
  "spacy>=3.8,<3.9",
  "spacy-curated-transformers>=0.3",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "textstat>=0.7",
  "sentence-transformers>=3.0",
  "transformers>=4.44,<5",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2.0",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "emoji>=2.10",
  "tqdm>=4.66",
  "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x==13.3.0"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
all = ["anthropic>=0.40", "openai>=1.40", "google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
voiceprint = "voiceprint.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiceprint = ["ts/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "models: needs the downloaded NLP models (slow)",
  "llm: calls a live LLM provider (costs money, needs a key)",
]
